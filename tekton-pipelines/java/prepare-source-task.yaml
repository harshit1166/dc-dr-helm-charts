apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: prepare-java-source
  namespace: ci-pipelines
spec:
  workspaces:
    - name: output
  steps:
    - name: write-files
      image: busybox
      script: |
        #!/bin/sh
        mkdir -p $(workspaces.output.path)
        cat > $(workspaces.output.path)/Dockerfile << 'DOCKERFILE_EOF'
        FROM eclipse-temurin:17-jre
        WORKDIR /app
        RUN echo 'public class Main { public static void main(String[] a) throws Exception { System.out.println("Hello from Java DC-DR pipeline!"); Thread.sleep(Long.MAX_VALUE); } }' > Main.java
        CMD ["sh", "-c", "echo Java app running - DC-DR demo && sleep infinity"]
        DOCKERFILE_EOF
